name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # No GH_TOKEN here on purpose: electron-builder would auto-publish its own
      # draft release alongside the real one below. Publishing is handled solely
      # by the release step.
      - name: Build and Distribute
        run: npm run dist

      - name: Resolve release notes
        id: tag_notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --force --tags origin
          # Prefer a committed notes file — git strips lines starting with '#'
          # from tag annotations, which silently eats markdown headings.
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo "message<<NOTES_EOF"
            if [ -f "$NOTES_FILE" ]; then
              echo "Using $NOTES_FILE" >&2
              cat "$NOTES_FILE"
            else
              git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.tag_notes.outputs.message }}
          generate_release_notes: true
          files: |
            dist-installer/*.exe
